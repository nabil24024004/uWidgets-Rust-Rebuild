[package]
name = "uwidgets-setup"
version = "1.0.0"
edition = "2024"
description = "Native Windows Setup Installer for uWidgets (Rust Edition) v1.0.0"
publish = false

[[bin]]
name = "uwidgets-setup"
path = "src/main.rs"

[dependencies]
flate2 = "1"
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
flate2 = "1"
winres = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
